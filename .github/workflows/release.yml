name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Never publish a release for a tag that does not compile.
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    # Repo default GITHUB_TOKEN is read-only; creating a release needs write.
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
